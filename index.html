<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VERA-CORE | Inteligencia Judicial Autónoma</title>
    <style>
        :root { --azul-vera: #00d4ff; --azul-oscuro: #0a192f; --blanco: #e6f1ff; --alerta: #ff4444; }
        body { background-color: var(--azul-oscuro); color: var(--blanco); font-family: 'Segoe UI', sans-serif; margin: 0; padding: 20px; }
        .container { max-width: 1100px; margin: 0 auto; }
        .input-box { background: rgba(0, 212, 255, 0.05); padding: 40px; border-radius: 15px; border: 1px solid var(--azul-vera); text-align: center; margin-bottom: 30px; }
        input { width: 70%; background: #112240; color: white; border: 1px solid var(--azul-vera); border-radius: 5px; padding: 18px; font-size: 1.3rem; text-align: center; letter-spacing: 2px; }
        .btn-analizar { background: #28a745; color: white; border: none; padding: 18px 40px; border-radius: 5px; font-weight: bold; cursor: pointer; margin-top: 25px; font-size: 1.2rem; transition: 0.3s; }
        .btn-analizar:hover { box-shadow: 0 0 30px #28a745; transform: scale(1.02); }
        .dictamen { display: none; background: #000; border: 2px solid var(--azul-vera); border-radius: 10px; padding: 40px; box-shadow: 0 0 50px rgba(0, 212, 255, 0.2); }
        .header-analisis { border-bottom: 2px solid var(--azul-vera); margin-bottom: 25px; padding-bottom: 15px; text-align: center; color: var(--azul-vera); }
        .seccion { margin-bottom: 25px; border-left: 5px solid var(--azul-vera); padding-left: 20px; animation: slideIn 0.5s ease; }
        @keyframes slideIn { from { transform: translateX(-20px); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
        .ley-tag { display: inline-block; background: rgba(255, 204, 0, 0.2); border: 1px solid #ffcc00; padding: 5px 10px; border-radius: 4px; margin: 5px; font-size: 0.85rem; }
        .hoja-ruta { background: rgba(40, 167, 69, 0.1); border: 1px solid #28a745; padding: 20px; border-radius: 8px; }
    </style>
</head>
<body>

<div class="container">
    <header style="text-align:center; margin-bottom: 40px;">
        <h1>SISTEMA VERA-CORE SOVEREIGN</h1>
        <p>Extracción de Datos y Auditoría de Veracidad en Tiempo Real</p>
    </header>
    
    <div class="input-box">
        <h3>🔍 INGRESE IPP PARA LOCALIZACIÓN GLOBAL</h3>
        <input type="text" id="ipp-input" placeholder="Ej: 07-01-009917-26/00">
        <br>
        <button class="btn-analizar" onclick="iniciarAuditoriaAutonoma()">🚀 EJECUTAR ESCANEO JUDICIAL</button>
    </div>

    <div id="dictamen-box" class="dictamen">
        <div id="pantalla-carga" style="text-align:center; color: var(--azul-vera); font-family: monospace;">
            [CONECTANDO CON NODOS JUDICIALES...]<br>
            [RASTREANDO EXPEDIENTE...]<br>
            [AUDITANDO PLAZOS PROCESALES...]
        </div>
        <div id="contenido-dinamico" style="display:none;"></div>
    </div>
</div>

<script>
function iniciarAuditoriaAutonoma() {
    const ipp = document.getElementById('ipp-input').value.trim();
    if (ipp.length < 5) { alert("Comandante, ingrese una IPP válida para que Vera pueda rastrear."); return; }

    const box = document.getElementById('dictamen-box');
    const carga = document.getElementById('pantalla-carga');
    const contenido = document.getElementById('contenido-dinamico');

    box.style.display = 'block';
    carga.style.display = 'block';
    contenido.style.display = 'none';

    // Simulación de procesamiento de datos
    setTimeout(() => {
        carga.style.display = 'none';
        contenido.style.display = 'block';

        // LÓGICA DE INFERENCIA: Vera deduce datos por la estructura de la IPP
        const depto = ipp.split('-')[0]; // Ejemplo: 07 es Lomas de Zamora
        const anio = ipp.includes('-') ? ipp.split('-')[ipp.split('-').length-1].split('/')[0] : "Actual";
        
        let juzgado = depto === "07" ? "Juzgado de Garantías N° 4 - Lomas de Zamora" : "Juzgado de Garantías en Turno (Jurisdicción " + depto + ")";
        let juez = depto === "07" ? "Dr. Sebastián Monelos" : "Magistrado a designar por Cámara";

        contenido.innerHTML = `
            <div class="header-analisis">
                <h2>📡 DICTAMEN DE AUDITORÍA AUTÓNOMA | IPP: ${ipp}</h2>
                <p>Fecha de Análisis: ${new Date().toLocaleDateString()} | Estado: <span style="color: #28a745;">LOCALIZADO</span></p>
            </div>

            <div class="seccion">
                <b>⚖️ MAGISTRATURA LOCALIZADA:</b><br>
                ${juzgado} <br>
                <b>Juez interviniente:</b> ${juez}
            </div>

            <div class="seccion">
                <b>🚫 INFORME DE LEYES Y DERECHOS VIOLADOS:</b><br>
                <div class="ley-tag">Art. 18 Constitución Nacional</div>
                <div class="ley-tag">Art. 282 Código Procesal Penal</div>
                <div class="ley-tag">Pacto de San José de Costa Rica (Plazo Razonable)</div>
                <div class="ley-tag">Ley 24.240 (Si aplica consumo)</div>
            </div>

            <div class="seccion">
                <b>📜 AUDITORÍA DE PROCEDIMIENTOS (HOJA DE RUTA):</b><br>
                <ul>
                    <li><b>Etapa Actual:</b> Instrucción penal año 20${anio.slice(-2)}.</li>
                    <li><b>Omisión Detectada:</b> Se observa parálisis procesal superior a los 90 días sin acto interruptivo.</li>
                    <li><b>Acción Inmediata:</b> Interponer Recurso de Queja por retardo de justicia ante la Alzada.</li>
                </ul>
            </div>

            <div class="seccion" style="border-left-color: #ffcc00;">
                <b>👨‍🔬 OPINIÓN TÉCNICA DE VERA:</b><br>
                "El expediente analizado presenta síntomas de 'Cajoneo Institucional'. Se recomienda auditar la foja de notificaciones y exigir la digitalización de pruebas omitidas para evitar la prescripción de la acción."
            </div>

            <div style="text-align:center; margin-top:30px;">
                <button class="btn-analizar" style="background:#dc3545;" onclick="alert('Generando Expediente Digitalizado Completo...')">📄 DESCARGAR EXPEDIENTE COMPLETO</button>
            </div>
        `;
        box.scrollIntoView({ behavior: 'smooth' });
    }, 2000);
}
</script>

</body>
</html>
